; Jana-Display: Mia OS auf dem ESP32-2432S028 ("Cheap Yellow Display").
;
; Das Board traegt ein ILI9341 mit 240x320 und einen resistiven Touch (XPT2046)
; an einem **eigenen** SPI-Bus. Genau daran scheitern die meisten Anleitungen:
; Display und Touch teilen sich hier nicht den Bus, wer beide auf VSPI legt,
; bekommt ein Display das flackert und einen Touch der nichts meldet.

[env:cyd]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
; Die Versionsnummer entsteht beim Bauen aus der Git-Historie, gleiche
; Regel wie in Mia OS: MAJOR.MINOR aus version.txt, Patch = Commit-Zahl.
extra_scripts = pre:version_bauen.py
; OTA braucht zwei App-Slots. Die Standardaufteilung hat die zwar, aber nur
; 1,25 MB je Slot, und der Build lag am 11.09.2026 schon bei 85 Prozent.
; min_spiffs gibt jedem Slot 1,875 MB, damit sind es 57 Prozent.
; ACHTUNG: Dieser Wechsel muss einmal ueber Kabel geflasht werden. Eine
; geaenderte Partitionstabelle laesst sich nicht ueber die Luft einspielen.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; 921600 schafft der USB-Wandler dieses Boards nicht zuverlaessig: der Upload
; bricht mit "Unable to verify flash chip connection (Serial data stream
; stopped)" ab, obwohl der Chip vorher sauber erkannt wurde.
upload_speed = 460800

lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	; Direkt aus dem Git-Baum: die Bibliothek liegt nicht mehr in der
	; PlatformIO-Registry (``UnknownPackageError``), obwohl fast jede
	; Anleitung zu diesem Board sie so einbindet.
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
	bblanchon/ArduinoJson@^7.0.4
	https://github.com/tzapu/WiFiManager.git#v2.0.17

build_flags =
	; TFT_eSPI wird ueber Compilerschalter eingestellt, nicht ueber eine
	; Header-Datei in der Bibliothek. Das ist Absicht: eine Datei in
	; ``.pio/libdeps`` ist beim naechsten ``pio pkg update`` weg, und dann
	; baut das Projekt auf einem anderen Rechner ein schwarzes Display.
	-D USER_SETUP_LOADED=1
	-D ILI9341_2_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	; Das Panel haengt an HSPI. VSPI gehoert dem Touch.
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=55000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D USE_HSPI_PORT=1
